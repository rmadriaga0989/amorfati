<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launchpad</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.75);
        --panel-strong: rgba(15, 23, 42, 0.95);
        --card: rgba(30, 41, 59, 0.9);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #a78bfa;
        --success: #22c55e;
        --danger: #ef4444;
        --shadow: 0 20px 50px rgba(15, 23, 42, 0.45);
      }

      body.light {
        --bg: #f8fafc;
        --panel: rgba(255, 255, 255, 0.75);
        --panel-strong: rgba(255, 255, 255, 0.95);
        --card: rgba(255, 255, 255, 0.9);
        --text: #0f172a;
        --muted: #475569;
        --accent: #0284c7;
        --accent-2: #7c3aed;
        --success: #16a34a;
        --danger: #dc2626;
        --shadow: 0 18px 45px rgba(148, 163, 184, 0.26);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
      }

      body.light {
        background: linear-gradient(135deg, #e2e8f0, #f8fafc);
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr;
      }

      .sidebar {
        background: var(--panel);
        backdrop-filter: blur(18px);
        border-right: 1px solid rgba(148, 163, 184, 0.14);
        padding: 24px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.1rem;
        margin-bottom: 32px;
        padding: 8px 10px;
      }

      .logo {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: var(--shadow);
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-btn {
        width: 100%;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        text-align: left;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.96rem;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .nav-btn:hover,
      .nav-btn.active {
        background: rgba(56, 189, 248, 0.12);
        border-color: rgba(56, 189, 248, 0.25);
      }

      .main {
        padding: 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .search-wrap {
        flex: 1;
        max-width: 620px;
      }

      .search {
        width: 100%;
        border: none;
        outline: none;
        padding: 14px 18px;
        color: var(--text);
        background: var(--panel-strong);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .theme-toggle {
        border: none;
        background: rgba(168, 85, 247, 0.15);
        color: var(--text);
        padding: 12px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat {
        background: var(--panel-strong);
        border-radius: 16px;
        padding: 18px 16px;
        box-shadow: var(--shadow);
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 6px;
      }

      .stat-value {
        font-size: 1.7rem;
        font-weight: 700;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 18px;
        padding: 18px 16px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 170px;
        transition: transform 0.15s ease, border 0.15s ease;
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: rgba(56, 189, 248, 0.35);
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .site-icon {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(167, 139, 250, 0.25));
      }

      .remove-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 1.15rem;
        cursor: pointer;
      }

      .card h3 {
        margin: 0 0 8px;
        font-size: 1.08rem;
      }

      .card .url {
        color: var(--muted);
        font-size: 0.8rem;
        word-break: break-all;
        margin-bottom: 16px;
      }

      .card-actions {
        display: flex;
        gap: 8px;
      }

      .open-btn,
      .add-btn,
      .submit-btn {
        border: none;
        cursor: pointer;
        color: white;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
      }

      .open-btn {
        flex: 1;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      .add-btn {
        background: rgba(34, 197, 94, 0.2);
        color: var(--text);
      }

      .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--success), #10b981);
      }

      .add-form {
        margin-top: 22px;
        background: var(--panel-strong);
        padding: 18px;
        border-radius: 18px;
        box-shadow: var(--shadow);
        display: none;
      }

      .add-form.active {
        display: block;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .field input,
      .field select {
        background: rgba(15, 23, 42, 0.2);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 10px;
        padding: 12px 10px;
        outline: none;
      }

      body.light .field input,
      body.light .field select {
        background: rgba(148, 163, 184, 0.08);
      }

      .empty {
        background: var(--panel-strong);
        padding: 28px 20px;
        border-radius: 16px;
        color: var(--muted);
        text-align: center;
        box-shadow: var(--shadow);
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          height: auto;
          position: static;
          border-right: none;
          border-bottom: 1px solid rgba(148, 163, 184, 0.14);
        }

        .nav {
          flex-direction: row;
          flex-wrap: wrap;
        }

        .topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">⚡</div>
          <div>Launchpad</div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-btn active" data-filter="all">All</button>
          <button class="nav-btn" data-filter="work">Work</button>
          <button class="nav-btn" data-filter="study">Study</button>
          <button class="nav-btn" data-filter="social">Social</button>
          <button class="nav-btn" data-filter="personal">Personal</button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="search-wrap">
            <input
              id="searchInput"
              type="text"
              class="search"
              placeholder="Search your links..."
            />
          </div>
          <button id="themeToggle" class="theme-toggle">Dark mode</button>
        </header>

        <section class="stats">
          <div class="stat">
            <div class="stat-label">Links</div>
            <div id="statsTotal" class="stat-value">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Work</div>
            <div id="statsWork" class="stat-value">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Study</div>
            <div id="statsStudy" class="stat-value">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Social</div>
            <div id="statsSocial" class="stat-value">0</div>
          </div>
        </section>

        <div class="section-header">
          <div class="section-title" id="sectionTitle">All links</div>
          <button id="toggleForm" class="add-btn">+ Add link</button>
        </div>

        <form id="addLinkForm" class="add-form">
          <div class="form-grid">
            <div class="field">
              <label>Title</label>
              <input name="title" type="text" placeholder="Notion" required />
            </div>

            <div class="field">
              <label>URL</label>
              <input
                name="url"
                type="url"
                placeholder="https://example.com"
                required
              />
            </div>

            <div class="field">
              <label>Category</label>
              <select name="category">
                <option value="work">Work</option>
                <option value="study">Study</option>
                <option value="social">Social</option>
                <option value="personal">Personal</option>
              </select>
            </div>

            <div class="field">
              <label>Icon</label>
              <input name="icon" type="text" placeholder="💼" value="🔗" />
            </div>
          </div>

          <div style="margin-top: 16px;">
            <button class="submit-btn" type="submit">Save link</button>
          </div>
        </form>

        <div id="linkGrid" class="grid"></div>
      </main>
    </div>

    <script>
      const STORAGE_KEY = "launchpad-links-v1";

      const workbookXml = `
        <workbook>
          <group name="work">
            <link title="GitHub" url="https://github.com" icon="💻" />
            <link title="Notion" url="https://www.notion.so/" icon="📝" />
            <link title="Gmail" url="https://mail.google.com/" icon="📧" />
            <link title="Linear" url="https://linear.app/" icon="📐" />
          </group>

          <group name="study">
            <link title="Coursera" url="https://www.coursera.org/" icon="🎓" />
            <link title="Khan Academy" url="https://www.khanacademy.org/" icon="📘" />
            <link title="YouTube Learning" url="https://www.youtube.com/" icon="🎬" />
            <link title="Docs" url="https://docs.google.com/" icon="📄" />
          </group>

          <group name="social">
            <link title="Instagram" url="https://www.instagram.com/" icon="📸" />
            <link title="WhatsApp" url="https://web.whatsapp.com/" icon="💬" />
            <link title="Discord" url="https://discord.com/" icon="🎧" />
            <link title="Twitter" url="https://x.com/" icon="🐦" />
          </group>

          <group name="personal">
            <link title="Spotify" url="https://open.spotify.com/" icon="🎵" />
            <link title="Netflix" url="https://www.netflix.com/" icon="🎞️" />
            <link title="Reddit" url="https://www.reddit.com/" icon="🤖" />
            <link title="Calendar" url="https://calendar.google.com/" icon="📅" />
          </group>
        </workbook>
      `;

      const defaultLinks = {
        work: [
          { title: "GitHub", url: "https://github.com", icon: "💻" },
          { title: "Notion", url: "https://www.notion.so/", icon: "📝" },
          { title: "Gmail", url: "https://mail.google.com/", icon: "📧" },
          { title: "Linear", url: "https://linear.app/", icon: "📐" }
        ],
        study: [
          { title: "Coursera", url: "https://www.coursera.org/", icon: "🎓" },
          { title: "Khan Academy", url: "https://www.khanacademy.org/", icon: "📘" },
          { title: "YouTube", url: "https://www.youtube.com/", icon: "🎬" },
          { title: "Docs", url: "https://docs.google.com/", icon: "📄" }
        ],
        social: [
          { title: "Instagram", url: "https://www.instagram.com/", icon: "📸" },
          { title: "WhatsApp", url: "https://web.whatsapp.com/", icon: "💬" },
          { title: "Discord", url: "https://discord.com/", icon: "🎧" },
          { title: "X", url: "https://x.com/", icon: "🐦" }
        ],
        personal: [
          { title: "Spotify", url: "https://open.spotify.com/", icon: "🎵" },
          { title: "Netflix", url: "https://www.netflix.com/", icon: "🎞️" },
          { title: "Reddit", url: "https://www.reddit.com/", icon: "🤖" },
          { title: "Calendar", url: "https://calendar.google.com/", icon: "📅" }
        ]
      };

      let links = loadLinks();
      let activeFilter = "all";
      let searchTerm = "";

      function loadLinks() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed === "object") {
              return parsed;
            }
          } catch (error) {
            console.warn("Invalid local storage data, falling back to defaults.");
          }
        }

        const parsedXml = parseWorkbookXml(workbookXml);
        if (parsedXml && Object.keys(parsedXml).length) {
          saveLinks(parsedXml);
          return parsedXml;
        }

        saveLinks(defaultLinks);
        return defaultLinks;
      }

      function saveLinks(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function parseWorkbookXml(xmlText) {
        try {
          const parser = new DOMParser();
          const xml = parser.parseFromString(xmlText, "application/xml");

          const groups = xml.querySelectorAll("group");
          const result = {};

          groups.forEach((group) => {
            const groupName = (group.getAttribute("name") || "").trim().toLowerCase();
            if (!groupName) return;

            const items = [];
            group.querySelectorAll("link").forEach((link) => {
              const title = link.getAttribute("title") || "Untitled";
              const url = link.getAttribute("url") || "#";
              const icon = link.getAttribute("icon") || "🔗";

              items.push({ title, url, icon });
            });

            if (items.length) result[groupName] = items;
          });

          return result;
        } catch (error) {
          console.error("Could not parse workbook XML:", error);
          return {};
        }
      }

      const sectionTitle = document.getElementById("sectionTitle");
      const linkGrid = document.getElementById("linkGrid");
      const navButtons = [...document.querySelectorAll(".nav-btn")];
      const searchInput = document.getElementById("searchInput");
      const themeToggle = document.getElementById("themeToggle");
      const toggleForm = document.getElementById("toggleForm");
      const addLinkForm = document.getElementById("addLinkForm");

      function getAllLinks() {
        return Object.keys(links).flatMap((category) => {
          return links[category].map((item) => ({
            ...item,
            category
          }));
        });
      }

      function renderStats() {
        const all = getAllLinks();
        document.getElementById("statsTotal").textContent = all.length;
        document.getElementById("statsWork").textContent = links.work?.length || 0;
        document.getElementById("statsStudy").textContent = links.study?.length || 0;
        document.getElementById("statsSocial").textContent = links.social?.length || 0;
      }

      function render() {
        const filtered = getAllLinks().filter((item) => {
          const matchesCategory =
            activeFilter === "all" || item.category === activeFilter;

          const matchesSearch =
            item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.url.toLowerCase().includes(searchTerm.toLowerCase());

          return matchesCategory && matchesSearch;
        });

        sectionTitle.textContent =
          activeFilter === "all"
            ? "All links"
            : activeFilter.charAt(0).toUpperCase() + activeFilter.slice(1);

        if (!filtered.length) {
          linkGrid.innerHTML = `
            <div class="empty">
              No links found for this search or category.
            </div>
          `;
          renderStats();
          return;
        }

        linkGrid.innerHTML = filtered
          .map(
            (item) => `
              <article class="card">
                <div class="card-top">
                  <div class="site-icon">${item.icon || "🔗"}</div>
                  <button class="remove-btn" data-remove="${item.category}|${item.title}" title="Remove link">×</button>
                </div>

                <div>
                  <h3>${item.title}</h3>
                  <div class="url">${item.url}</div>
                </div>

                <div class="card-actions">
                  <button class="open-btn" data-open="${item.url}">Open</button>
                </div>
              </article>
            `
          )
          .join("");

        renderStats();
      }

      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          navButtons.forEach((btn) => btn.classList.toggle("active", btn === button));
          render();
        });
      });

      searchInput.addEventListener("input", (event) => {
        searchTerm = event.target.value.trim();
        render();
      });

      linkGrid.addEventListener("click", (event) => {
        const openLink = event.target.dataset.open;
        if (openLink) {
          window.open(openLink, "_blank", "noopener");
          return;
        }

        const removeTarget = event.target.dataset.remove;
        if (!removeTarget) return;

        const [category, title] = removeTarget.split("|");
        if (!links[category]) return;

        links[category] = links[category].filter((item) => item.title !== title);
        saveLinks(links);
        render();
      });

      toggleForm.addEventListener("click", () => {
        addLinkForm.classList.toggle("active");
      });

      addLinkForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const formData = new FormData(addLinkForm);
        const category = formData.get("category");
        const title = formData.get("title").toString().trim();
        const url = formData.get("url").toString().trim();
        const icon = formData.get("icon").toString().trim() || "🔗";

        if (!title || !url) return;

        if (!links[category]) links[category] = [];
        links[category].push({ title, url, icon });

        saveLinks(links);
        addLinkForm.reset();
        addLinkForm.classList.remove("active");
        render();
      });

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("light");
        const isLight = document.body.classList.contains("light");
        themeToggle.textContent = isLight ? "Light mode" : "Dark mode";
      });

      render();
    </script>
  </body>
</html>
